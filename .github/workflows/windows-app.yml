# Builds the Windows desktop app and proves it runs, on a real Windows machine.
#
# The smoke test is the point of this file, not the build: it launches the packaged Jarvis.exe,
# has the bundled llama-server.exe load a tiny real model, and streams one reply through the whole
# app. No GPU here, so it runs on CPU - which is the part that proves the Windows launcher and the
# packaging, not the part that measures speed.
name: windows-app

on:
  push:
    branches: [main]
    # A tag like v0.2.0 is a release: the same build, then published where the app's updater
    # looks for it (server/updates/updater.py).
    tags: ["v*"]
  pull_request:
  # Run by hand from the Actions tab. With a version, it is a release too: the workflow creates
  # the tag itself, for when tags cannot be pushed from where the release is being cut.
  workflow_dispatch:
    inputs:
      release:
        description: "Version to publish, e.g. 0.2.0. Leave empty to only build and test."
        required: false
        default: ""
      notes:
        description: "Release notes (used when publishing from here)."
        required: false
        default: ""

permissions:
  # write only so a release build can publish; branch and PR builds never do.
  contents: write

env:
  LLAMA_TAG: b11139
  # 15M parameters, ~20MB: enough to prove tokens come out, small enough not to matter.
  SMOKE_MODEL_REPO: ggml-org/models
  SMOKE_MODEL_FILE: tinyllamas/stories15M-q4_0.gguf

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the version from the tag
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
        shell: pwsh
        run: |
          $version = if ("${{ inputs.release }}") { "${{ inputs.release }}".TrimStart("v") } else { "${{ github.ref_name }}".TrimStart("v") }
          Set-Content server/version.py "`"`"`"Stamped from the release tag by CI.`"`"`"`n`nVERSION = `"$version`"`n"
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -e ".[desktop,voice,forecast]"

      - name: Build the frontend
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Fetch llama.cpp (Windows, CUDA 12)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python packaging/fetch_llama.py $env:LLAMA_TAG

      - name: The bundled llama-server runs on Windows
        run: packaging\llama\llama-server.exe --version

      - name: Render the icon
        run: python packaging/make_icon.py

      - name: Build Jarvis.exe
        run: pyinstaller packaging/jarvis.spec --noconfirm --distpath build/dist --workpath build/work

      # The smoke test never opens a window, so it passed while every user got a browser tab
      # instead of the app. This opens the real window on the real page and checks React drew.
      - name: Window test the packaged app
        shell: pwsh
        run: |
          $env:JARVIS_HOME = (New-Item -ItemType Directory -Force window-home).FullName
          $env:JARVIS_PROVIDERS__LLAMACPP__AUTOSTART = "false"
          $p = Start-Process -FilePath build\dist\Jarvis\Jarvis.exe -ArgumentList "--window-test" -Wait -PassThru
          Get-Content window-home\logs\jarvis.log | Select-String -Pattern "window test|ERROR|Traceback" -Context 0,12
          if ($p.ExitCode -ne 0) { throw "the window did not open and render (exit code $($p.ExitCode))" }

      - name: Fetch a tiny model for the smoke test
        run: |
          New-Item -ItemType Directory -Force smoke-home/models | Out-Null
          Invoke-WebRequest "https://huggingface.co/$env:SMOKE_MODEL_REPO/resolve/main/$env:SMOKE_MODEL_FILE" -OutFile smoke-home/models/stories15M-q4_0.gguf

      - name: Smoke test the packaged app
        shell: pwsh
        run: |
          $env:JARVIS_HOME = (Resolve-Path smoke-home).Path
          $env:JARVIS_SMOKE_CHAT = "1"
          # Voice too: fetch the smallest Whisper through the app's own voice pack download, then
          # speak a sentence with Piper and hear it back - both engines, inside the packaged exe.
          $env:JARVIS_SMOKE_VOICE = "1"
          # And forecasting: fetch the real Kronos weights, import a NinjaTrader-format export,
          # forecast ES an hour ahead with PyTorch inside the packaged exe.
          $env:JARVIS_SMOKE_FORECAST = "1"
          $env:JARVIS_VOICE__STT_MODEL = "tiny.en"
          $env:JARVIS_PROVIDERS__LLAMACPP__MODEL_PATH = (Resolve-Path smoke-home/models/stories15M-q4_0.gguf).Path
          $env:JARVIS_PROVIDERS__LLAMACPP__CTX_LEN = "512"
          $env:JARVIS_PROVIDERS__OLLAMA__ENABLED = "false"
          $env:JARVIS_PROVIDERS__LMSTUDIO__ENABLED = "false"
          # A windowed exe does not block the shell and has no console: wait on it explicitly,
          # then read what it wrote to its log.
          $p = Start-Process -FilePath build\dist\Jarvis\Jarvis.exe -ArgumentList "--smoke-test" -Wait -PassThru
          Get-Content smoke-home\logs\jarvis.log | Select-String -Pattern "smoke test|tokens_streamed|heard|forecast|problems|ERROR|Traceback" -Context 0,3
          if (Test-Path smoke-home\data\llama-server.log) { Write-Host "--- llama-server.log (tail) ---"; Get-Content smoke-home\data\llama-server.log -Tail 25 }
          if ($p.ExitCode -ne 0) { throw "smoke test failed with exit code $($p.ExitCode)" }

      - name: Fetch the WebView2 bootstrapper
        run: Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile packaging\MicrosoftEdgeWebview2Setup.exe

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $version = if ($env:APP_VERSION) { $env:APP_VERSION } else { "0.1.0" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\jarvis.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Zip the portable folder
        run: Compress-Archive -Path build\dist\Jarvis -DestinationPath build\Jarvis-portable.zip

      # Two artifacts, not one: each is most of a gigabyte (the CUDA runtime is the bulk), and you
      # only ever want one of them. Bundled together you would download both.
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: JarvisSetup
          path: build/installer/JarvisSetup.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0  # already LZMA-compressed; zipping it again only costs time

      - name: Upload the portable folder
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-portable
          path: build/Jarvis-portable.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # The update feed. latest.json names the installer and its sha256; the app downloads the
      # installer, checks it against that hash, and only then offers "Restart to update".
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          $installer = "build/installer/JarvisSetup.exe"
          $tag = "v$env:APP_VERSION"
          $notes = if ($env:NOTES) { $env:NOTES } else { (git tag -l --format="%(contents)" $tag) -join "`n" }
          if (-not $notes.Trim()) { $notes = "Jarvis $env:APP_VERSION" }
          @{
            version = $env:APP_VERSION
            notes = $notes.Trim()
            installer = @{
              url = "https://github.com/${{ github.repository }}/releases/download/$tag/JarvisSetup.exe"
              sha256 = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
              size = (Get-Item $installer).Length
            }
          } | ConvertTo-Json -Depth 3 | Set-Content -Encoding utf8NoBOM build/latest.json
          # From a tag push the tag exists; from the Actions tab, --target creates it on this commit.
          gh release create $tag $installer build/latest.json build/Jarvis-portable.zip --title "Jarvis $env:APP_VERSION" --notes $notes --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
