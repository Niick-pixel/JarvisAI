[project]
name = "jarvis"
version = "0.1.0"
description = "A local-first AI workspace"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "sqlite-vec>=0.1.6",
    "nvidia-ml-py>=12.560",
    "huggingface-hub>=0.26",
    "psutil>=6.1",
    # M4 (PLAN.md section 6.2): knowledge and memory.
    "GitPython>=3.1",
    "markdown-it-py>=3.0",
    "numpy>=2.1",
    "watchdog>=6.0",
    "pymupdf>=1.24",
    # M6 (PLAN.md 6.2): cron for ambient agents. Its schedule is rebuilt from our own table,
    # so no SQLAlchemy job store comes with it.
    "apscheduler>=3.10",
    # Exchange time zones (America/Chicago for CME). Windows has no IANA database of its own.
    "tzdata>=2024.1",
    # Files: edit Word documents paragraph by paragraph, keeping their formatting.
    "python-docx>=1.1",
    # Screen awareness: a screenshot, pure Python over the OS's own APIs (no Pillow needed).
    "mss>=9.0",
    # Phone companion: the pairing QR code, drawn as SVG in pure Python.
    "segno>=1.6",
]

[project.optional-dependencies]
# M5 (PLAN.md 6.2, 1.5): speech in and out. Optional because a text-only install has no reason to
# carry an ONNX runtime, and because both engines refuse to run without weights you fetched.
voice = [
    "faster-whisper>=1.1",
    "piper-tts>=1.2",
    # The natural voice. Its espeak-ng comes in its own wheel (espeakng-loader).
    "kokoro-onnx>=0.4",
]
# The Windows desktop build (PLAN.md 7a): a native window, and the bundler that makes the .exe.
# Futures forecasting with Kronos (server/forecast). PyTorch runs it on the CPU; the weights are
# fetched from inside the app, like voice. pandas, einops, safetensors and tqdm are what the
# vendored Kronos code imports.
forecast = [
    "torch>=2.2",
    "pandas>=2.2",
    "einops>=0.8",
    "safetensors>=0.4",
    "tqdm>=4.66",
]
desktop = [
    "pywebview>=5.3",
    "pyinstaller>=6.10",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Third-party code kept verbatim so upstream fixes apply with a copy (see its __init__.py).
extend-exclude = ["server/forecast/kronos"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
packages = ["server"]
ignore_missing_imports = true
disallow_untyped_defs = true
exclude = ["server/forecast/kronos/"]

[[tool.mypy.overrides]]
module = ["server.forecast.kronos.*"]
follow_imports = "skip"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
